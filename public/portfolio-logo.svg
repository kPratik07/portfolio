<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" stroke="url(#gradient2)" stroke-width="3"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Letters PR -->
  <text x="100" y="125" font-family="'Poppins', Arial, sans-serif" font-size="80" font-weight="700" fill="white" text-anchor="middle">PR</text>
  
  <!-- Decorative Code Brackets -->
  <text x="35" y="115" font-family="monospace" font-size="50" font-weight="300" fill="rgba(255,255,255,0.6)">&lt;</text>
  <text x="150" y="115" font-family="monospace" font-size="50" font-weight="300" fill="rgba(255,255,255,0.6)">/&gt;</text>
  
  <!-- Accent Dot -->
  <circle cx="100" cy="145" r="5" fill="white" opacity="0.8"/>
</svg>
